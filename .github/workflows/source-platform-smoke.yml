name: Source Platform Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke & Contract – ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install test dependencies
        run: pip install pytest

      - name: Run headless smoke and contract tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/source_platform_smoke.py tests/test_metadata.py -v --basetemp=.pytest_tmp

      - name: Run full regression suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -v --basetemp=.pytest_tmp
