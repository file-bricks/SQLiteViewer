[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqliteviewer"
version = "2.1.0"
description = "Local-first Python/Tkinter desktop SQLite database browser for Windows, Linux, and macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
  { name = "file-bricks" }
]
maintainers = [
  { name = "Lukas Geiger", email = "support@lukasgeiger.com" }
]
keywords = [
  "sqlite",
  "database-browser",
  "tkinter",
  "local-first",
  "csv-export",
  "json-export",
  "python-desktop"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database :: Front-Ends",
  "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.9.0",
]
build = [
  "pyinstaller>=6.10.0",
  "pyinstaller-hooks-contrib>=2024.0",
  "altgraph>=0.17.4",
  "packaging>=24.0",
  "setuptools>=61.0",
]

[project.urls]
Homepage = "https://github.com/file-bricks/SQLiteViewer"
Repository = "https://github.com/file-bricks/SQLiteViewer.git"
Documentation = "https://github.com/file-bricks/SQLiteViewer/blob/master/README.md"
"German Documentation" = "https://github.com/file-bricks/SQLiteViewer/blob/master/README_de.md"
"LLM Context Index" = "https://github.com/file-bricks/SQLiteViewer/blob/master/llms.txt"
"Third-Party Licenses" = "https://github.com/file-bricks/SQLiteViewer/blob/master/THIRD_PARTY_LICENSES.md"
Notice = "https://github.com/file-bricks/SQLiteViewer/blob/master/NOTICE"
"Marketing Log" = "https://github.com/file-bricks/SQLiteViewer/blob/master/MARKETING-LOG.txt"
Issues = "https://github.com/file-bricks/SQLiteViewer/issues"
"Security Advisories" = "https://github.com/file-bricks/SQLiteViewer/security/advisories/new"
"Microsoft Store" = "https://apps.microsoft.com/detail/9P6H501XB8JT"

[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -v --basetemp=.pytest_tmp"
norecursedirs = [".git", ".pytest_cache", ".ruff_cache", "build", "dist", ".venv", "runs", ".work", "assets", "store_assets", "store_package", "web_companion/node_modules"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "build", "dist", "web_companion"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"_WARTUNG/*" = ["E402"]
