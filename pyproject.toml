[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqliteviewer"
version = "2.1.0"
description = "Local-first Python/Tkinter desktop SQLite database browser for Windows, Linux, and macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "file-bricks" }
]
keywords = [
  "sqlite",
  "database-browser",
  "tkinter",
  "local-first",
  "csv-export",
  "json-export",
  "python-desktop"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database :: Front-Ends",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/file-bricks/SQLiteViewer"
Repository = "https://github.com/file-bricks/SQLiteViewer.git"
Documentation = "https://github.com/file-bricks/SQLiteViewer/blob/master/README.md"
"German Documentation" = "https://github.com/file-bricks/SQLiteViewer/blob/master/README_de.md"
"LLM Context Index" = "https://github.com/file-bricks/SQLiteViewer/blob/master/llms.txt"
"Third-Party Licenses" = "https://github.com/file-bricks/SQLiteViewer/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/file-bricks/SQLiteViewer/blob/master/MARKETING-LOG.txt"
Issues = "https://github.com/file-bricks/SQLiteViewer/issues"
"Microsoft Store" = "https://apps.microsoft.com/detail/9P6H501XB8JT"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -v"
